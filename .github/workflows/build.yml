name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/HomeControl.Core.Tests/HomeControl.Core.Tests.csproj -c Release

  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          $rid = if ('${{ matrix.platform }}' -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          dotnet publish src/HomeControl.App/HomeControl.App.csproj `
            -c Release -p:Platform=${{ matrix.platform }} -r $rid --self-contained `
            -o publish/HomeControl-$rid
      - name: Smoke test (open every window and page)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'smoke-test.txt'
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $app = Start-Process -FilePath 'publish/HomeControl-win-x64/HomeControl.exe' `
            -ArgumentList '--smoke-test', $result, $shots -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'Smoke test timed out' }
          $log = Join-Path $env:LOCALAPPDATA 'HomeControl\home-control.log'
          if (Test-Path $log) { Get-Content $log }
          if (-not (Test-Path $result)) { throw "Smoke test wrote no result (exit code $($app.ExitCode))" }
          $text = (Get-Content $result -Raw).Trim()
          Write-Output $text
          if ($text -ne 'OK') { throw 'Smoke test failed' }
      - name: Publish screenshot previews (temporary)
        if: matrix.platform == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.Drawing
          $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          foreach ($shot in Get-ChildItem (Join-Path $env:RUNNER_TEMP 'screenshots') -Filter *.jpg) {
            $image = [System.Drawing.Image]::FromFile($shot.FullName)
            $text = $null
            foreach ($scale in 1.0, 0.8, 0.65, 0.5, 0.4) {
              $w = [int]($image.Width * $scale); $h = [int]($image.Height * $scale)
              $small = New-Object System.Drawing.Bitmap $w, $h
              $g = [System.Drawing.Graphics]::FromImage($small)
              $g.InterpolationMode = 'HighQualityBicubic'
              $g.DrawImage($image, 0, 0, $w, $h)
              $parameters = New-Object System.Drawing.Imaging.EncoderParameters 1
              $parameters.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality, [long]70)
              $buffer = New-Object IO.MemoryStream
              $small.Save($buffer, $jpeg, $parameters)
              $text = [Convert]::ToBase64String($buffer.ToArray())
              if ($text.Length -le 65000) { break }
            }
            $body = @{
              name = "preview $($shot.BaseName)"; head_sha = '${{ github.sha }}'; status = 'completed'; conclusion = 'neutral'
              output = @{ title = $shot.BaseName; summary = 'Base64 JPEG preview'; text = $text }
            } | ConvertTo-Json -Depth 5
            $run = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/${{ github.repository }}/check-runs' -Headers $headers -Body $body
            Write-Output "$($shot.BaseName): check run $($run.id) ($($text.Length) chars)"
          }
      - name: Upload screenshots
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: Screenshots
          path: ${{ runner.temp }}/screenshots/
      - uses: actions/upload-artifact@v6
        with:
          name: HomeControl-${{ matrix.platform }}
          path: publish/
          if-no-files-found: error
