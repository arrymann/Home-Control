name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/HomeControl.Core.Tests/HomeControl.Core.Tests.csproj -c Release

  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          $rid = if ('${{ matrix.platform }}' -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          dotnet publish src/HomeControl.App/HomeControl.App.csproj `
            -c Release -p:Platform=${{ matrix.platform }} -r $rid --self-contained `
            -o publish/HomeControl-$rid
      - name: Smoke test (open every window and page)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'smoke-test.txt'
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $app = Start-Process -FilePath 'publish/HomeControl-win-x64/HomeControl.exe' `
            -ArgumentList '--smoke-test', $result, $shots -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'Smoke test timed out' }
          $log = Join-Path $env:LOCALAPPDATA 'HomeControl\home-control.log'
          if (Test-Path $log) { Get-Content $log }
          if (-not (Test-Path $result)) { throw "Smoke test wrote no result (exit code $($app.ExitCode))" }
          $text = (Get-Content $result -Raw).Trim()
          Write-Output $text
          if ($text -ne 'OK') { throw 'Smoke test failed' }
      - name: Builder without its window (Windows PowerShell)
        if: matrix.platform == 'x64'
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'builder-no-window'
          & .\tools\builder\Build-HomeControl.ps1 -NoGui -Platform x64 -Destination $destination -NoShortcut -NoStart
          if ($LASTEXITCODE -ne 0) { throw "The builder failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $destination 'HomeControl.exe'))) { throw 'The builder made no HomeControl.exe' }
      - name: Builder window (builds, adds the Start menu shortcut, starts the app)
        if: matrix.platform == 'x64'
        shell: powershell
        run: |
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $destination = Join-Path $env:RUNNER_TEMP 'builder-window'
          $exe = Join-Path $destination 'HomeControl.exe'
          $builder = Start-Process -FilePath powershell.exe -PassThru -ArgumentList @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-STA', '-File', '"tools\builder\Build-HomeControl.ps1"',
            '-SmokeTest', "`"$shots`"", '-Destination', "`"$destination`"")
          if (-not $builder.WaitForExit(1500000)) { $builder.Kill(); throw 'The builder window timed out' }
          $buildLog = Join-Path $env:LOCALAPPDATA 'HomeControl\build.log'
          if (Test-Path $buildLog) { Get-Content $buildLog }
          $result = (Get-Content (Join-Path $shots 'builder-result.txt') -Raw).Trim()
          Write-Output $result
          if ($result -ne 'OK') { throw 'The builder window failed' }

          $app = @(Get-Process HomeControl -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
          if ($app.Count -ne 1) { throw 'The builder did not start Home Control' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Home Control.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne $exe) { throw "The Start menu shortcut points to '$target'" }

          # Building again into the same folder has to close the running app first.
          & .\tools\builder\Build-HomeControl.ps1 -NoGui -Platform x64 -Destination $destination -NoShortcut -NoStart
          if ($LASTEXITCODE -ne 0) { throw "Rebuilding failed with exit code $LASTEXITCODE" }
          if (-not $app[0].HasExited) { throw 'Home Control is still running after the rebuild' }
          if (-not (Select-String -Path $buildLog -Pattern 'Home Control closed' -Quiet)) { throw 'The builder did not see Home Control close' }
          if (Select-String -Path $buildLog -Pattern "didn't close on request" -Quiet) { throw 'Home Control ignored the exit request' }

          # "HomeControl.exe --exit" closes a running instance too.
          $app = Start-Process -FilePath $exe -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Home Control did not keep running' }
          Start-Process -FilePath $exe -ArgumentList '--exit' -Wait
          if (-not $app.WaitForExit(20000)) { throw 'Home Control did not exit on --exit' }
      - name: Upload screenshots
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: Screenshots
          path: ${{ runner.temp }}/screenshots/
      - uses: actions/upload-artifact@v6
        with:
          name: HomeControl-${{ matrix.platform }}
          path: publish/
          if-no-files-found: error
