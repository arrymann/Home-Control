name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/HomeControl.Core.Tests/HomeControl.Core.Tests.csproj -c Release

  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          $rid = if ('${{ matrix.platform }}' -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          dotnet publish src/HomeControl.App/HomeControl.App.csproj `
            -c Release -p:Platform=${{ matrix.platform }} -r $rid --self-contained `
            -o publish/HomeControl-$rid
      - uses: actions/upload-artifact@v6
        with:
          name: HomeControl-${{ matrix.platform }}
          path: publish/
          if-no-files-found: error
